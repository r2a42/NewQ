[package]
name = "newq"
version = "0.1.1"
edition = "2024"
description = "A simple, cross-platform cue-based video playback system built on FFmpeg"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["theatre", "video", "playback", "cue", "show-control"]
categories = ["multimedia::video"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
env_logger = "0.11.11"
log = "0.4.34"
parking_lot = "0.12.5"
pollster = "1.0.1"
rfd = "0.17.2"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
