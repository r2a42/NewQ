[package]
name = "newq"
version = "0.20.2"
edition = "2024"
description = "A simple, cross-platform cue-based video playback system built on FFmpeg"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["theatre", "video", "playback", "cue", "show-control"]
categories = ["multimedia::video"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
jiff = "0.2"
libloading = "0.8"
log = "0.4.34"
md-5 = "0.11.0"
midir = "0.11.1"
parking_lot = "0.12.5"
pollster = "1.0.1"
rfd = "0.17.2"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
softbuffer = "0.4"
snap = "1.1.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
ureq = "3"
wgpu = "30.0.1"
winit = "0.30.13"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.21.2"
hayro = "0.8"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"

# Same versions as winit's, to ask a Mac for each display's name.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSScreen", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSColor", "NSCursor"] }
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSNotification", "NSOperation", "block2"] }
block2 = "0.5"
objc2 = "0.5"
core-foundation = "0.9"
core-graphics = "0.23"

# To end the streaming server with NewQ, whichever way NewQ ends.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The icon in the Windows executable (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# To read each monitor's EDID (make, model, serial) by the name Windows gives it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
