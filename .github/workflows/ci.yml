name: CI

# One run per change: pull requests are tested as they are updated, and `main`
# is tested after a merge (the Cut release workflow needs CI to have passed on
# its tip). A branch with no pull request isn't tested until it has one.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run in progress. Runs on `main`
# are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg version
        shell: bash
        run: ffmpeg -hide_banner -version | head -1

      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Generate test media
        shell: bash
        run: bash scripts/make_test_media.sh
      - name: Test (integration tests must not skip)
        run: cargo test
        env:
          NEWQ_REQUIRE_MEDIA: "1"
