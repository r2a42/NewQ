name: CI

# One run per change: pull requests are tested as they are updated, and `main`
# is tested after a merge (the Cut release workflow needs CI to have passed on
# its tip). A branch with no pull request isn't tested until it has one.
# Changes that only touch documentation aren't tested; scripts/check_main_ci.sh
# lets a release go ahead past such commits.
#
# A rebase merge makes new commits with the same files as the pull request's
# last commit, so when that is all a push to `main` is (the same tree as a
# pull request head that CI passed on) the `gate` job says so and the builds
# are skipped; the run still counts as passed for the release check. Anything
# else, such as a merge after `main` moved on, is tested in full.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE-*"]

# A newer push to a pull request replaces its run in progress. Runs on `main`
# are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository: the builds get a read-only token (the
# gate job asks for what it needs itself).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.same.outputs.tested }}
    steps:
      - id: same
        name: Has this exact tree already passed CI in its pull request?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree="$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha)"
            for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha' || true); do
              [ "$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)" = "$tree" ] || continue
              passed="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq .total_count)"
              if [ "$passed" -ge 1 ]; then
                echo "Tree $tree passed CI as $head in its pull request; not testing it again"
                tested=true
                break
              fi
            done
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Each system runs two jobs side by side: "tests" (fmt, clippy, the tests)
  # and "self-test" (the program's headless full check). They share one cache
  # of compiled libraries per system, which warm-cache.yml fills on `main` (a
  # pull request can only use caches made by itself or by `main`, and `main`'s
  # CI runs skip the builds); only "tests" saves it, so the storage isn't doubled.
  check:
    name: ${{ matrix.part }} (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        part: [tests, self-test]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # This step once sat for 40 minutes on a stalled package mirror.
        timeout-minutes: 10
        run: |
          # When the runner's own resolver can't find Ubuntu's archive (it timed out
          # for hours on 2026-11-11 while public resolvers answered), say which
          # resolvers do and use public ones for the rest of the job.
          if ! timeout 15 getent ahostsv4 azure.archive.ubuntu.com > /dev/null; then
            echo "::warning::azure.archive.ubuntu.com does not resolve with the runner's DNS"
            resolvectl status || true
            for ns in 127.0.0.53 168.63.129.16 8.8.8.8 1.1.1.1; do
              echo "== $ns"; timeout 10 dig +short +time=3 +tries=1 @"$ns" azure.archive.ubuntu.com A || true
            done
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=8.8.8.8 1.1.1.1\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf
            sudo systemctl restart systemd-resolved
            timeout 15 getent ahostsv4 azure.archive.ubuntu.com || echo "::warning::still not resolving"
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # mesa's Vulkan software driver (lavapipe), so the GPU tests and the
          # self-test's 3D stage draw here instead of skipping for want of a card.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libasound2-dev libudev-dev libxkbcommon-dev ffmpeg mesa-vulkan-drivers libvulkan1
          # For the rest of the job (the tests and the self-test): draw with
          # it, and fail rather than skip when there is no adapter. Linux only:
          # the checks read whether NEWQ_REQUIRE_GPU is set at all, so an empty
          # value on the other systems would count.
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "NEWQ_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg version
        shell: bash
        run: ffmpeg -hide_banner -version | head -1

      # The key must be the same here and in warm-cache.yml (rust-cache would
      # otherwise put the job's name in it), and so must everything that goes
      # into it: the toolchain and the CARGO*/RUST*/CC* environment.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: newq-${{ runner.os }}
          add-job-id-key: false
          cache-on-failure: true
          save-if: ${{ matrix.part == 'tests' }}
      - if: matrix.part == 'tests'
        run: cargo fmt --check
      - if: matrix.part == 'tests'
        run: cargo clippy --all-targets -- -D warnings

      - name: Generate test media
        if: matrix.part == 'tests'
        shell: bash
        run: bash scripts/make_test_media.sh
      - name: Test (integration tests must not skip)
        if: matrix.part == 'tests'
        run: cargo test
        env:
          NEWQ_REQUIRE_MEDIA: "1"

      # The program itself, with no window: every kind of cue played through
      # the show engine and FFmpeg on this system, each checked for what it
      # did, and the same zip Test Mode makes kept as an artifact (the report,
      # the log at its Detailed level, any crash report), passed or not.
      # Built in its own step: in a job of its own the self-test no longer finds
      # the program already built, and a cold Windows build takes ~15 minutes on
      # its own, which once used up the self-test's whole limit.
      - name: Build for the self-test
        if: matrix.part == 'self-test'
        timeout-minutes: 30
        run: cargo build
      - name: Self-test (the full check, headless)
        if: matrix.part == 'self-test'
        timeout-minutes: 15
        run: cargo run -- --self-test --out selftest/run
      - name: Keep the self-test's files
        if: always() && matrix.part == 'self-test'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ runner.os }}
          path: |
            selftest/*.zip
            selftest/run/report.txt
          if-no-files-found: warn
          retention-days: 14
