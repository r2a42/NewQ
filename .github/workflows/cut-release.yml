name: Cut release

# Comment `/release v0.2.1` on any issue or pull request, as the repository
# owner, to tag the tip of the default branch and publish that release (the
# tag then goes through the Release workflow). Add `dry-run` to run every check
# without tagging. The tag must match the version in Cargo.toml, and CI must
# have passed on the tip of the default branch.
#
# This exists so a release can be started with a comment from a browser or
# phone, without pushing tags or running workflows by hand. The comment is meant
# to be posted by a person: the comment tool Claude uses rewrites slash
# commands, so Claude can't start it that way.
#
# The same checks run from the Actions tab ("Run workflow", with the tag and
# the dry-run box) or `gh workflow run cut-release.yml -f tag=vX.Y.Z`. Starting
# it needs write access and is only accepted from the repository owner's own
# account, which is also how a session working with the owner's token (for
# example Claude, set up with /web-setup) can cut a release.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0 (must match the version in Cargo.toml)"
        required: true
      dry_run:
        description: "Run every check but don't tag"
        type: boolean
        default: false

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions: {}

jobs:
  cut:
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, '/release ')) ||
      (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      BODY: ${{ github.event.comment.body }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read the request
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
            echo "DRY_RUN=$INPUT_DRY_RUN" >> "$GITHUB_ENV"
            exit 0
          fi
          first="$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')"
          read -r _ tag opt extra <<< "$first"
          if [ -n "${extra:-}" ] || { [ -n "${opt:-}" ] && [ "$opt" != "dry-run" ]; }; then
            echo "Expected '/release vX.Y.Z' or '/release vX.Y.Z dry-run'." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "DRY_RUN=$([ "${opt:-}" = "dry-run" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Check the tag and version
        run: scripts/check_release_tag.sh "$TAG"

      - name: Check the tag is new and CI has passed
        run: |
          sha="$(git rev-parse HEAD)"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          scripts/check_main_ci.sh "$sha"

      - name: Tag and start the release
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "NewQ $TAG"
          git push origin "refs/tags/$TAG"
          # A tag pushed with the workflow token doesn't start other workflows,
          # so start the Release workflow for it directly.
          gh workflow run release.yml --ref "$BRANCH" -f tag="$TAG"

      - name: Say what happened
        if: success()
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            msg="Dry run: $TAG is ready to release from \`${SHA:0:7}\` on $BRANCH. Nothing was tagged. ($RUN_URL)"
          else
            msg="Tagged $TAG at \`${SHA:0:7}\` and started the Release workflow, which builds and publishes it. ($RUN_URL)"
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$msg"
          else
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say why it failed
        if: failure()
        run: |
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "The release did not go ahead; see the log: $RUN_URL"
          fi
